services:
  - type: web
    name: hospital-bulk-processing
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    maxShutdownDelaySeconds: 75
    autoDeployTrigger: checksPass
    envVars:
      - key: UPSTREAM_BASE_URL
        value: https://hospital-directory.onrender.com
